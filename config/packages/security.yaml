security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Hierarchie des roles : un ADMIN herite de PDR et USER, etc.
    # (evite d'avoir a cocher plusieurs roles pour un meme utilisateur)
    role_hierarchy:
        ROLE_ADMIN:      [ROLE_PDR, ROLE_TECHNICIAN, ROLE_VIGIL, ROLE_DG, ROLE_USER]
        ROLE_PDR:        ROLE_USER
        ROLE_TECHNICIAN: ROLE_USER
        ROLE_VIGIL:      ROLE_USER
        ROLE_DG:         ROLE_USER

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Authentifieur du formulaire web (page /Authentification).
            custom_authenticator: App\Security\AppCustomAuthenticator

            # Authentifieur JSON pour l'app mobile (POST /api/login).
            # - pas de CSRF (inutile pour un client mobile)
            # - lit {"email": "...", "password": "..."} dans le corps JSON
            # - en cas d'echec renvoie automatiquement un 401 JSON
            json_login:
                check_path: api_login
                username_path: email
                password_path: password

            logout:
                path: app_logout
                # where to redirect after logout
                target: app_dashboard

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    # STRATEGIE : « deny by default ». Tout est verrouillé sauf ce qui est
    # explicitement public. L'ordre compte : la PREMIERE regle qui matche gagne.
    access_control:
        # 1) Routes PUBLIQUES (accessibles sans etre connecte)
        - { path: ^/Authentification, roles: PUBLIC_ACCESS }   # page de connexion web
        - { path: ^/api/login,        roles: PUBLIC_ACCESS }   # login JSON (app mobile)

        # 2) Zones STRICTEMENT reservees aux administrateurs
        #    (ces controleurs n'avaient aucune garde -> on les protege ici)
        - { path: ^/AdminSys,       roles: ROLE_ADMIN }   # gestionnaire de base
        - { path: ^/adminSecurity,  roles: ROLE_ADMIN }   # export SQL de la base
        - { path: ^/SupprimeTables, roles: ROLE_ADMIN }   # suppression de tables (!)
        - { path: ^/Directions,     roles: ROLE_ADMIN }
        - { path: ^/users,          roles: ROLE_ADMIN }   # gestion des utilisateurs
        - { path: ^/groupe,         roles: ROLE_ADMIN }
        - { path: ^/poste,          roles: ROLE_ADMIN }
        - { path: ^/widget,         roles: ROLE_ADMIN }

        # 3) TOUT LE RESTE exige une session authentifiee (deny by default).
        #    getRoles() garantit ROLE_USER a chaque utilisateur connecte.
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
