security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Authentifieur du formulaire web (page /Authentification).
            custom_authenticator: App\Security\AppCustomAuthenticator

            # Authentifieur JSON pour l'app mobile (POST /api/login).
            # - pas de CSRF (inutile pour un client mobile)
            # - lit {"email": "...", "password": "..."} dans le corps JSON
            # - en cas d'echec renvoie automatiquement un 401 JSON
            json_login:
                check_path: api_login
                username_path: email
                password_path: password

            logout:
                path: app_logout
                # where to redirect after logout
                target: app_dashboard

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # IMPORTANT : /api/login doit rester accessible sans etre deja connecte
        # (c'est json_login qui authentifie cette requete). On le place AVANT
        # une eventuelle regle qui protegerait ^/api.
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        # Decommentez pour verrouiller toutes vos routes API (recommande en prod) :
        # - { path: ^/api, roles: ROLE_USER }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
